<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>Web Security Header Auditor</title><desc>Conceptual project workflow, not live telemetry.</desc><style>.packet{animation:travel 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.spin{transform-origin:230px 155px;animation:spin 10s linear infinite}@keyframes travel{0%{transform:translateX(0);opacity:.2}50%{opacity:1}100%{transform:translateX(270px);opacity:.2}}@keyframes pulse{50%{opacity:.2}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.packet,.pulse,.spin{animation:none}}</style><rect width="1000" height="300" rx="18" fill="#080f1d"/><g font-family="monospace"><text x="28" y="40" fill="#7dd3fc" font-size="22">WEB SECURITY HEADER AUDITOR</text><rect x="45" y="80" width="380" height="145" rx="12" fill="#12233a" stroke="#38bdf8"/><text x="65" y="112" fill="#7dd3fc" font-size="17">HTTP RESPONSE</text><text x="65" y="150" fill="#cbd5e1" font-size="17">CSP / HSTS / cookie flags</text><text x="65" y="185" fill="#cbd5e1" font-size="17">One response. No crawling.</text><path d="M425 156H825" stroke="#385c7c"/><rect class="packet" x="450" y="148" width="22" height="16" fill="#38bdf8"/><text x="765" y="125" fill="#a78bfa" font-size="17">REVIEW</text><text x="730" y="200" fill="#cbd5e1" font-size="17">Context matters</text><text x="28" y="280" fill="#8099b5" font-size="12">CONCEPTUAL WORKFLOW / fresh portfolio implementation</text></g></svg>